spring.application.name=SpringBootJpaBasicLogging

# DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jpa_basic_logging
spring.datasource.username=root
spring.datasource.password=

# Session Persistence
server.servlet.session.persistent=false

# jpa
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# logging
logging.file.name=logs/basic-logging.log
logging.logback.rollingpolicy.file-name-pattern=logs/basic-logging-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=7